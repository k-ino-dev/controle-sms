services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - INITIAL_DIRECTOR_USERNAME=${INITIAL_DIRECTOR_USERNAME:-directeur}
      - INITIAL_DIRECTOR_PASSWORD=${INITIAL_DIRECTOR_PASSWORD:-admin}
      - SMS_PROVIDER=${SMS_PROVIDER:-winsms}
      - WINSMS_API_KEY=${WINSMS_API_KEY}
      - WINSMS_SENDER_ID=${WINSMS_SENDER_ID:-ELIMTIAZ}
      - WINSMS_API_URL=${WINSMS_API_URL:-https://api.winsms.tn/v1}
      - NODE_ENV=production
    volumes:
      # Persistance de la base SQLite et des fichiers statiques
      - ./data/prisma:/app/prisma
      - ./data/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      web:
        condition: service_healthy
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
