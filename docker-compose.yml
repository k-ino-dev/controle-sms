services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - JWT_SECRET=${JWT_SECRET}
      - INITIAL_DIRECTOR_USERNAME=${INITIAL_DIRECTOR_USERNAME:-directeur}
      - INITIAL_DIRECTOR_PASSWORD=${INITIAL_DIRECTOR_PASSWORD}
      - SMS_PROVIDER=${SMS_PROVIDER:-winsms}
      - WINSMS_API_KEY=${WINSMS_API_KEY}
      - WINSMS_SENDER_ID=${WINSMS_SENDER_ID:-ELIMTIAZ}
      - WINSMS_API_URL=${WINSMS_API_URL:-https://api.winsms.tn/v1}
      - UPLOADS_DIR=/app/data/uploads
      - BACKUPS_DIR=/app/data/backups
      - NODE_ENV=production
    volumes:
      # Volumes persistants dédiés sur l'hôte (zéro écrasement de code, zéro perte de données)
      - ./data/db:/app/data
      - ./data/uploads:/app/data/uploads
      - ./data/backups:/app/data/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

volumes:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
